name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Compositor.app (x86_64)
    # Release build for Intel Macs (14.7+): downloaded from the Actions artifacts. Cross-compiled on the runner.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      # Ad-hoc signed (CODE_SIGN_IDENTITY=-): fine for personal use; the app may need a right-click
      # Open the first time, since Gatekeeper has no Developer ID to verify.
      # Xcode 26.6's SIL optimizer crashes cross-compiling Release for x86_64, so this falls back from -O through
      # -Osize to -Onone and keeps whichever level first builds; the winner is noted in the step summary.
      - name: Build Release (x86_64)
        run: |
          for level in -O -Osize -Onone; do
            echo "::group::Build with SWIFT_OPTIMIZATION_LEVEL=$level"
            if xcodebuild build \
              -project Compositor.xcodeproj \
              -scheme Compositor \
              -destination 'platform=macOS,arch=x86_64' \
              -configuration Release \
              -derivedDataPath DerivedData \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGNING_REQUIRED=NO \
              ENABLE_CODE_COVERAGE=NO \
              SWIFT_COMPILATION_MODE=incremental \
              SWIFT_OPTIMIZATION_LEVEL=$level \
              > build.log 2>&1; then
              echo "::endgroup::"
              echo "Built with SWIFT_OPTIMIZATION_LEVEL=$level" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::endgroup::"
            echo "Build failed with $level; last lines:"
            tail -5 build.log
            rm -rf DerivedData build.log
          done
          exit 1

      - name: Zip Compositor.app
        run: >
          cd DerivedData/Build/Products/Release
          && ditto -c -k --keepParent Compositor.app Compositor-intel.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-intel
          path: DerivedData/Build/Products/Release/Compositor-intel.zip
          retention-days: 30
